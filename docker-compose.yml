version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: gasme-db-prod
    restart: unless-stopped
    command: --default-time-zone='-06:00'
    environment:
      TZ: America/Mexico_City
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-G4sm32015}
      MYSQL_DATABASE: ${DB_NAME:-telmex_cdr}
      MYSQL_USER: ${DB_USER:-admin}
      MYSQL_PASSWORD: ${DB_PASSWORD:-G4sm32015}
    ports:
      - "3308:3307"
    volumes:
      - db_data:/var/lib/mysql
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - app-network

  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: gasme-backend-prod
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - TZ=America/Mexico_City
      - PORT=${PORT:-3000}
      - DB_HOST=${DB_HOST:-db}
      - DB_USER=${DB_USER:-admin}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-telmex_cdr}
      - JWT_SECRET=${JWT_SECRET}
      - TELMEX_USERID=${TELMEX_USERID}
      - TELMEX_USERPASS=${TELMEX_USERPASS}
      - SMTP_HOST=${SMTP_HOST:-smtp.ionos.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - FRONTEND_URL=${FRONTEND_URL:-http://192.168.2.243:8080}
      - APP_URL=${APP_URL:-http://192.168.2.243:8080}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    depends_on:
      - db
    networks:
      - app-network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: gasme-frontend-prod
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    environment:
      - TZ=America/Mexico_City
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:


